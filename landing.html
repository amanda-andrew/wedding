<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amanda &amp; Andrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f0f0f;
    --ivory:#F5F5F3;
    --line:rgba(245,245,243,0.55);
    --overlay-top: rgba(0,0,0,0.45);
    --overlay-bottom: rgba(0,0,0,0.78);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    font-family:'Jost', sans-serif;
    background:var(--ink);
    color:var(--ivory);
  }

  /* ---------- Full-bleed hero photo ---------- */
  .hero{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
  }
  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 30%;
    filter:grayscale(100%) contrast(1.08);
  }
  .hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(to bottom, var(--overlay-top) 0%, rgba(0,0,0,0.25) 40%, var(--overlay-bottom) 100%);
  }

  /* ---------- Monogram crest ---------- */
  .crest{
    width:64px;
    height:64px;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .crest::before{
    content:'';
    position:absolute;
    inset:5px;
    border:1px solid rgba(245,245,243,0.28);
    border-radius:50%;
  }
  .crest span{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:20px;
    letter-spacing:1px;
    color:var(--ivory);
  }

  /* ---------- Hero content ---------- */
  .hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .hero-content .crest{ margin-bottom:30px; }

  .hero-content h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:clamp(2.3rem, 6vw, 4rem);
    letter-spacing:0.06em;
    line-height:1.15;
  }

  .hero-content .amp{
    font-style:italic;
    opacity:0.75;
    padding:0 0.15em;
  }

  .hero-content .date{
    margin-top:18px;
    font-size:0.75rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(245,245,243,0.7);
  }

  .hero-content .divider{
    width:1px;
    height:44px;
    background:linear-gradient(to bottom, transparent, var(--line), transparent);
    margin:28px 0;
  }

  .hero-content .tag{
    font-size:0.68rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:rgba(245,245,243,0.55);
  }

  /* ---------- Scroll cue ---------- */
  .scroll-cue{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    opacity:0.6;
  }
  .scroll-cue span{
    font-size:0.6rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
  }
  .scroll-cue .line{
    width:1px;
    height:26px;
    background:var(--ivory);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.2; transform:scaleY(0.6); }
    50%{ opacity:1; transform:scaleY(1); }
  }

  @media (max-width:480px){
    .crest{ width:54px; height:54px; }
    .crest span{ font-size:17px; }
  }
</style>
</head>
<body>

  <section class="hero">
    <img src="hero.jpg" alt="Amanda and Andrew">
    <div class="hero-content">
      <div class="crest"><span>A&amp;A</span></div>
      <h1>Amanda <span class="amp">&amp;</span> Andrew</h1>
      <div class="date">Save the Date &mdash; 2027</div>
      <div class="divider"></div>
      <div class="tag">More details coming soon</div>
    </div>
    <div class="scroll-cue">
      <span>Scroll</span>
      <div class="line"></div>
    </div>
  </section>

</body>
</html>
